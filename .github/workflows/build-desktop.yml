# Version PC de DiaSmart (Compose Desktop) : installeur Windows (.msi) et Mac (.dmg).
# - A chaque push / PR touchant le PC ou le module commun : construit les installeurs
#   (Actions > ce run > Artifacts).
# - Lancement manuel avec "publier" = true : ajoute les installeurs a la release
#   GitHub v<version>. Si elle n'existe pas encore (changement PC seulement, pas
#   de nouvel APK), elle est creee ici et devient la derniere version.
name: Version PC

on:
  push:
    branches: [master, 'claude/**']
    paths: ['desktop/**', 'shared/**', 'app/build.gradle.kts', '.github/workflows/build-desktop.yml']
  pull_request:
    paths: ['desktop/**', 'shared/**', 'app/build.gradle.kts', '.github/workflows/build-desktop.yml']
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier les installeurs dans la release v<version> (creee si besoin)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  installeur:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tache: packageMsi
            format: msi
          - os: macos-latest
            tache: packageDmg
            format: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Construire l'installeur
        run: gradle -p desktop ${{ matrix.tache }} --stacktrace

      # Windows : refait le .msi avec le logo DiaSmart dans les pages de l'installeur
      # (modele WiX desktop/installeur/windows/main.wxs). Si cette etape echoue,
      # on garde le .msi standard construit juste avant.
      - name: Installeur avec le logo
        if: ${{ matrix.format == 'msi' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candle = Get-ChildItem -Path desktop/build -Recurse -Filter candle.exe | Select-Object -First 1
          if (-not $candle) { throw "WiX introuvable" }
          $env:PATH = "$($candle.DirectoryName);$env:PATH"
          $env:DIASMART_BANNER = (Resolve-Path desktop/installeur/windows/banner.bmp).Path
          $env:DIASMART_DIALOG = (Resolve-Path desktop/installeur/windows/dialog.bmp).Path
          $v = (Select-String -Path app/build.gradle.kts -Pattern 'versionName = "([0-9.]+)"').Matches[0].Groups[1].Value
          # packageMsi part des .jar : on construit l'application (dossier) a part
          gradle -p desktop createDistributable
          if ($LASTEXITCODE -ne 0) { throw "createDistributable a echoue" }
          $app = Get-ChildItem -Path desktop/build/compose/binaries/main/app -Directory | Select-Object -First 1
          if (-not $app) { throw "Application introuvable" }
          $sortie = "desktop/build/msi-logo"
          if (Test-Path $sortie) { Remove-Item -Recurse -Force $sortie }
          & "$env:JAVA_HOME/bin/jpackage" --type msi `
            --app-image $app.FullName `
            --dest $sortie --name DiaSmart --app-version $v --vendor DiaSmart `
            --description "DiaSmart pour PC : espace etablissement de sante" `
            --win-menu --win-menu-group DiaSmart --win-shortcut --win-dir-chooser `
            --win-upgrade-uuid 5d0f3c7e-9a41-4b8e-a6a2-3f1d2c9b7e10 `
            --resource-dir desktop/installeur/windows
          if ($LASTEXITCODE -ne 0) { throw "jpackage a echoue ($LASTEXITCODE)" }
          Copy-Item "$sortie/DiaSmart-$v.msi" "desktop/build/compose/binaries/main/msi/DiaSmart-$v.msi" -Force
          Write-Host "Installeur avec logo : DiaSmart-$v.msi"

      - name: Retrouver le fichier
        id: fichier
        shell: bash
        run: |
          set -euo pipefail
          F=$(ls desktop/build/compose/binaries/main/${{ matrix.format }}/*.${{ matrix.format }} | head -1)
          echo "chemin=$F" >> "$GITHUB_OUTPUT"
          echo "nom=$(basename "$F")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: DiaSmart-PC-${{ matrix.format }}
          path: ${{ steps.fichier.outputs.chemin }}
          retention-days: 30

      - name: Ajouter a la release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publier }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          # Version PC seule : la release n'existe pas encore. Les deux installeurs
          # tournent en meme temps, donc on tolere que l'autre l'ait creee juste avant.
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --target "$GITHUB_SHA" --latest \
              --title "DiaSmart PC v$VERSION" \
              --notes "Version PC (Windows .msi, Mac .dmg). Si DiaSmart PC est déjà installé, il propose la mise à jour au démarrage." \
              || sleep 10
            gh release view "v$VERSION" >/dev/null
          fi
          gh release upload "v$VERSION" "${{ steps.fichier.outputs.chemin }}" --clobber
