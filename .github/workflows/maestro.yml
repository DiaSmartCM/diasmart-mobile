name: E2E Tests (Maestro Cloud)

# Lance les 5 scenarios Maestro sur chaque PR + manuellement.
# Necessite un compte Maestro Cloud (gratuit jusqu'a 100 runs/mois)
# + secret MAESTRO_CLOUD_API_KEY dans GitHub repo settings.

on:
  pull_request:
    branches: [master]
    paths:
      - 'app/src/**'
      - 'maestro/**'
      - '.github/workflows/maestro.yml'
  workflow_dispatch:  # bouton "Run workflow" manuel

jobs:
  # Pre-check : promouvoir le secret en output. GitHub Actions interdit
  # ${{ secrets.X }} directement dans un `if:` de step (cf. doc officielle),
  # donc on passe par un job qui evalue la presence et expose un boolean.
  check-secrets:
    name: Check Maestro secrets
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.probe.outputs.has_key }}
    steps:
      - id: probe
        env:
          MAESTRO_KEY: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
        run: |
          if [ -n "$MAESTRO_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MAESTRO_CLOUD_API_KEY secret not configured. E2E job will be skipped."
            echo "To enable E2E tests, sign up at https://cloud.mobile.dev/"
            echo "Then add MAESTRO_CLOUD_API_KEY in repo Settings > Secrets > Actions"
          fi

  e2e-maestro:
    name: Maestro Cloud E2E
    needs: check-secrets
    if: needs.check-secrets.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build debug APK (unsigned for Maestro Cloud)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Run Maestro Cloud tests
        uses: mobile-dev-inc/action-maestro-cloud@v1
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          app-file: app/build/outputs/apk/debug/app-debug.apk
          android-api-level: 33
          workspace: maestro/tests
          env: |
            MAESTRO_EMAIL=${{ secrets.MAESTRO_EMAIL }}
            MAESTRO_OTP=${{ secrets.MAESTRO_OTP }}
